<!doctype html>
<title>Shadow</title>
<style>body { margin: 0 }</style>
<x-box></x-box>
<script>
  window.log = [];
  addEventListener("message", (e) => log.push(e.data));
  customElements.define("x-box", class extends HTMLElement {
    constructor() {
      super();
      const r = this.attachShadow({ mode: "closed" });
      r.innerHTML = `<style>#sc { position: absolute; left: 0; top: 0; width: 200px; height: 80px; overflow: auto } #sc div { height: 400px } #si { position: absolute; left: 0; top: 100px } iframe { position: absolute; left: 0; top: 150px; width: 300px; height: 100px; border: 0 }</style>
        <div id="sc"><div>scroll me</div></div>
        <label for="si">Shadow field</label><input id="si">
        <iframe src="http://localhost:8000/frame.html"></iframe>`;
      window.si = r.getElementById("si");
      window.sc = r.getElementById("sc");
    }
  });
</script>
