[Service]
EnvironmentFile=-/etc/airdrop-contacts.conf
ExecStart=
ExecStart=/usr/bin/sh -c 'i=$(cat /sys/class/net/awdl0/ifindex) || exit 1; /usr/bin/opendrop receive $${MODEL:+-m "$$MODEL"} $${NAME:+-n "$$NAME"} & p=$$!; while kill -0 $$p 2>/dev/null; do sleep 5; [ "$(cat /sys/class/net/awdl0/ifindex 2>/dev/null)" = "$$i" ] || { kill $$p; exit 1; }; done; wait $$p'
