# Apple ID hashes advertised over BLE so Contacts-Only receivers recognise us.
# Either point at an Apple ID validation record plist:
RECORD_PLIST=/etc/airdrop-contacts/record.plist
# ...or list the first 2 bytes of each ValidatedEmail/PhoneHash directly:
#HASHES=3959,7512,7fb5,abc8

# Shown on the peer's share sheet. The icon is drawn by iOS/macOS from MODEL
# (an Apple model identifier); custom images are not possible in AirDrop.
MODEL=MacBookPro18,3
NAME=m2
