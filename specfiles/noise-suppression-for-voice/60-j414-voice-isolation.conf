context.modules = [
    {   name = libpipewire-module-filter-chain
        args = {
            node.description = "Voice Isolation"
            media.name = "Voice Isolation"
            filter.graph = {
                nodes = [
                    {
                        type = ladspa
                        name = rnnoise
                        plugin = /usr/lib64/ladspa/librnnoise_ladspa.so
                        label = noise_suppressor_mono
                        control = {
                            "VAD Threshold (%)" = 50.0
                            "VAD Grace Period (ms)" = 200
                            "Retroactive VAD Grace (ms)" = 0
                        }
                    }
                ]
            }
            audio.rate = 48000
            audio.channels = 1
            audio.position = [ MONO ]
            capture.props = {
                node.name = "capture.j414-mic-voice"
                target.object = "effect_output.j414-mic"
                node.passive = true
            }
            playback.props = {
                node.name = "effect_output.j414-mic-voice"
                media.class = Audio/Source
                priority.session = 1900
            }
        }
    }
]
